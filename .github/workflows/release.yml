name: Release

# Builds the Windows and Linux binaries and attaches them to a draft GitHub release.
#
# Run it by hand from the Actions tab, picking the release tag as the ref ("Use workflow
# from" -> the tag). The tag is the version, and it has to match the version declared in
# Cargo.toml - the manifest stays the single declaration, this only checks it.
#
# Nothing is published to crates.io; the package is `publish = false`.
#
# The release is left as a draft, so the notes can be edited before it goes live. Running
# this twice for one tag fails, because the release already exists; to replace a binary on
# an existing release, use `gh release upload <tag> <file> --clobber` instead.

on:
  workflow_dispatch:

env:
  TAG: ${{ github.ref_name }}
  CARGO_TERM_COLOR: always
  # Without this the binary needs the VC++ redistributable installed, which rather defeats
  # shipping one self-contained file. Scoped to the target rather than set as plain
  # RUSTFLAGS, so build scripts and proc macros are still built for the host as usual.
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static

jobs:
  build:
    name: Build for ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux
            # Deliberately not ubuntu-latest: the binary links against the glibc it was
            # built with and will not start on anything older, so building on the oldest
            # supported runner keeps it usable on more distributions.
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      # First, so that dispatching against a branch by mistake costs seconds rather than a
      # whole build.
      - name: Check that a tag was selected
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Run this workflow with a release tag selected as the ref, not '$TAG'"
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Needed by tray-icon: GTK 3 plus an AppIndicator implementation for the tray icon.
      # The release binary only links GTK; libappindicator is loaded at runtime, but the
      # tests need it present.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      # No cargo cache on purpose: a release is worth building from scratch, and this
      # workflow runs rarely enough that the time does not matter.

      - name: Check the tag matches Cargo.toml
        run: |
          # `cargo pkgid` prints either `<url>#<version>` or `<url>#<name>@<version>`,
          # depending on whether the package name matches its directory; taking everything
          # after the last '#' or '@' handles both without needing jq.
          declared=$(cargo pkgid | sed -e 's/.*[#@]//')
          echo "Cargo.toml declares: $declared"
          if [ "$declared" != "$TAG" ]; then
            echo "::error::Cargo.toml declares '$declared' but the tag is '$TAG'"
            exit 1
          fi

      - name: Run tests
        run: cargo test --locked --verbose

      - name: Build
        # The target is named explicitly so that the CARGO_TARGET_..._RUSTFLAGS above
        # certainly applies.
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Name the binary after the version
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/moonwatch_rs.exe" \
             "dist/moonwatch_rs-$TAG-x86_64-windows.exe"
          ls -l dist

      # A tarball rather than the bare binary, so that it keeps its executable bit. It
      # holds nothing but the binary - `moonwatch_rs install` writes the default
      # configuration and sets up the Systemd user service by itself.
      - name: Pack the binary into a versioned tarball
        if: runner.os == 'Linux'
        run: |
          name="moonwatch_rs-$TAG-x86_64-linux"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/moonwatch_rs" "dist/$name/"
          tar -czvf "dist/$name.tar.gz" -C dist "$name"
          rm -r "dist/$name"
          ls -l dist

      - name: Upload the binary for the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Separate from the builds, so the release is only created once every binary is ready -
  # a failed build leaves no half-populated draft behind.
  release:
    name: Draft the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release

    steps:
      - name: Download the binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          # No checkout in this job, so gh has to be told which repository it is in.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --generate-notes \
            --title "Moonwatch.rs $TAG" \
            dist/*
