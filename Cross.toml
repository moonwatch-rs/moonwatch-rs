# Configuration for cross-compiling with `cross` (https://github.com/cross-rs/cross).
#
# The Linux build needs the GTK 3 development files, which the stock `cross` images do not
# ship: `gtk-sys` looks them up with pkg-config. The tray icon itself needs no dev package,
# since `libappindicator-sys` loads libappindicator at runtime with `libloading`.

[target.x86_64-unknown-linux-gnu]
pre-build = [
    "apt-get update && apt-get install --assume-yes --no-install-recommends libgtk-3-dev",
]
