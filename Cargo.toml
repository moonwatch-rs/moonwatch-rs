[package]
name = "moonwatch-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Tomas Karabela <tkarabela@seznam.cz>"]
readme = "README.md"
repository = "https://github.com/tkarabela/moonwatch-rs"
license = "MIT"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
anyhow = "1.0.103"
whoami = "2.1.2"
crossbeam-channel = "0.5.16"
uuid = { version = "1.24.0", features = ["v7"] }
clap = { version = "4.6.2", features = ["derive"] }
schemars = { version = "1.2.2", features = ["chrono04"] }
log = "0.4.31"
flexi_logger = "0.31.9"
# `libxdo` is only needed for muda's predefined Copy/Cut/Paste items, which we don't use.
tray-icon = { version = "0.24.2", default-features = false, features = ["gtk"] }
# Decodes the embedded tray icon into RGBA for tray_icon::Icon::from_rgba().
png = "0.18.1"
serde_with = { version = "3.21.0" ,features = ["chrono_0_4"] }
serde_derive = "1.0.229"
uuidv7 = "0.1.7"
jsonschema = { version = "0.48.0", default-features = false, features = ["macros"] }
polars = { version = "0.55.2", features = ["default", "lazy", "strings", "regex", "is_in"] }

[dev-dependencies]
tempfile = "3.12"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.4"
# Must stay in lockstep with the gtk version used by tray-icon: its GTK backend asserts
# gtk::is_initialized(), which is per-crate-instance, so two gtk versions would panic.
gtk = "0.18.2"

[target.'cfg(windows)'.dependencies]
ctrlc = "3.5.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading",
                                            "Win32_System_SystemInformation",
                                            "Win32_UI_WindowsAndMessaging", "Win32_System_StationsAndDesktops",
                                            "Win32_UI_Input_KeyboardAndMouse",
                                            "Win32_System_LibraryLoader",
                                            "Win32_Graphics_Gdi"] }
