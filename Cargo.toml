[package]
name = "moonwatch-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Tomas Karabela <tkarabela@seznam.cz>"]
readme = "README.md"
repository = "https://github.com/tkarabela/moonwatch-rs"
license = "MIT"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.45"
regex = "1.13.1"
json = "0.12.4"
anyhow = "1.0.103"
whoami = "2.1.2"
crossbeam-channel = "0.5.16"
uuid = { version = "1.24.0", features = ["v7"] }
clap = { version = "4.6.2", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.4"

[target.'cfg(windows)'.dependencies]
ctrlc = "3.5.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading",
                                            "Win32_System_SystemInformation",
                                            "Win32_UI_WindowsAndMessaging", "Win32_System_StationsAndDesktops",
                                            "Win32_UI_Input_KeyboardAndMouse"] }
